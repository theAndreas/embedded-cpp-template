# What a change to the template is checked with: a project is made from it, and the project's
# own checks run on it, as tests/check.sh runs them in the dev container of any project made
# from it. A template change passes only if a project made from it passes.
name: Template

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    # A job per check, side by side: one after the other they took 14 minutes, none of them more
    # than two. Each makes its project from scratch, so none needs another.
    strategy:
      fail-fast: false
      matrix:
        include:
          # The template's own scripts, with the checks template/.shellcheckrc turns on and the
          # rules of template/pyproject.toml; the indent of the Doxygen blocks; the checks of our
          # own, which tidy builds in the project as well; and that the cache of tools/tidy.sh
          # skips clang-tidy only where the result cannot differ. Each against its cases.
          - name: The template's own scripts and their cases
            run: |
              uvx --from shellcheck-py==0.11.0.1 shellcheck --enable=check-extra-masked-returns \
                tests/check.sh
              uvx --from ruff==0.17.3 ruff check --select F,E9 tests
              tests/doc_indent.py
              tests/tidy_module.py
              tests/tidy_cache.py

          # A library of CMake alone, arduino=false: every check, and the checks that walk TARGETS
          # for an ATmega328P and an ATmega2560.
          - name: A library of CMake alone
            run: tests/check.sh --no-arduino
          - name: A library of CMake alone for two targets
            run: >-
              tests/check.sh --no-arduino --targets
              tidy cppcheck headers examples self-check stack

          # A firmware, kind=firmware: every check, and the checks that walk TARGETS for an
          # ATmega328P and an AVR128DA48, which takes the other branch of platform/avr/main.cpp.
          - name: A firmware
            run: tests/check.sh --firmware
          - name: A firmware for two targets
            run: >-
              tests/check.sh --firmware --targets
              tidy cppcheck headers examples self-check stack

          # A firmware built by PlatformIO, platformio=true: every check, and with a second target
          # built by CMake, two build systems in one project.
          - name: A firmware of PlatformIO
            run: tests/check.sh --firmware --platformio
          - name: A firmware of PlatformIO and CMake
            run: >-
              tests/check.sh --firmware --platformio --targets
              tidy cppcheck headers examples self-check stack

          # An Arduino library with library.json, platformio=true: its examples built by
          # arduino-cli and by PlatformIO, two targets of two build systems, every check.
          - name: An Arduino library of PlatformIO
            run: tests/check.sh --platformio

          # The Arduino library built for two targets, an Uno and a Mega: the checks that walk
          # TARGETS.
          - name: A project of two targets
            run: tests/check.sh --targets tidy cppcheck headers examples self-check

          # Every target of `make check`, with warnings as errors.
          - name: A project
            run: tests/check.sh
    steps:
      - uses: actions/checkout@v7
        with:
          # copier reads the template's history to name the version a project was made from.
          fetch-depth: 0

      # setup-uv has no tag for a major version, only full ones.
      - uses: astral-sh/setup-uv@v10.3.3

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      # As the Dockerfile of the template installs them, through the action a project's CI
      # installs with, so that a change to it is tried here before a project gets it; gcc-avr and
      # avr-libc as .devcontainer/shared/install.sh installs them for the repository's container.
      - name: Install the tools from apt
        uses: ./template/.github/actions/apt-install
        with:
          packages: >-
            cmake ninja-build libgtest-dev clang libclang-rt-dev simavr jq doxygen cppcheck gcc-avr
            avr-libc

      # For the clang-tidy module of the template, which tidy builds in the project as well.
      - uses: ./template/.github/actions/llvm-headers
        with:
          root: template

      # For `make arduino-lint` of the project, at the version the template's Dockerfile pins,
      # through the action a project's CI installs with.
      - uses: ./template/.github/actions/arduino-lint-setup
        with:
          root: template

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
