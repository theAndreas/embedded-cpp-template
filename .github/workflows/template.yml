# What a change to the template is checked with: a project is made from it, and the project's
# own checks run on it, as tests/check.sh runs them in the dev container of any project made
# from it. A template change passes only if a project made from it passes.
name: Template

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first answer worthless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: A project made from the template
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # copier reads the template's history to name the version a project was made from.
          fetch-depth: 0

      # setup-uv has no tag for a major version, only full ones.
      - uses: astral-sh/setup-uv@v10.3.3

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      # As the Dockerfile of the template installs them, through the action a project's CI
      # installs with, so that a change to it is tried here before a project gets it; and the
      # repository's own packages, as its dev container installs them.
      - name: Install the tools from apt
        uses: ./template/.github/actions/apt-install
        with:
          packages: >-
            cmake ninja-build libgtest-dev clang libclang-rt-dev simavr jq doxygen cppcheck
          file: template/.devcontainer/apt-packages.repo.txt

      # With the checks template/.shellcheckrc turns on, and the rules of template/pyproject.toml.
      - name: The template's own scripts
        run: |
          uvx --from shellcheck-py==0.11.0.1 shellcheck --enable=check-extra-masked-returns \
            tests/check.sh
          uvx --from ruff==0.17.3 ruff check --select F,E9 tests

      - name: The indent of the Doxygen blocks against its cases
        run: tests/doc_indent.py

      # For the clang-tidy module of the template, which tidy builds in the project as well.
      - uses: ./template/.github/actions/llvm-headers
        with:
          root: template

      - name: The checks of our own against their cases
        run: tests/tidy_module.py

      # A library of CMake alone, arduino=false: every check, and the checks that walk TARGETS for
      # an ATmega328P and an ATmega2560. Before the Arduino library's steps, as each run makes
      # build/Demo anew and the last one's is kept for arduino-lint.
      - name: Make a library of CMake alone and check it
        run: tests/check.sh --no-arduino

      - name: Make a library of CMake alone for two targets and check it
        run: tests/check.sh --no-arduino --targets tidy cppcheck headers examples self-check stack

      # A firmware, kind=firmware: every check, and the checks that walk TARGETS for an
      # ATmega328P and an AVR128DA48, which takes the other branch of platform/avr/main.cpp.
      - name: Make a firmware and check it
        run: tests/check.sh --firmware

      - name: Make a firmware for two targets and check it
        run: tests/check.sh --firmware --targets tidy cppcheck headers examples self-check stack

      # A firmware built by PlatformIO, platformio=true: every check, and with a second target
      # built by CMake, two build systems in one project.
      - name: Make a firmware of PlatformIO and check it
        run: tests/check.sh --platformio

      - name: Make a firmware of PlatformIO and CMake and check it
        run: tests/check.sh --platformio --targets tidy cppcheck headers examples self-check stack

      # The Arduino library built for two targets, an Uno and a Mega: the checks that walk
      # TARGETS.
      - name: Make a project of two targets and check it
        run: tests/check.sh --targets tidy cppcheck headers examples self-check

      # Every target of `make check` but arduino-lint, which the runner has not installed, with
      # warnings as errors.
      - name: Make a project and check it
        run: |
          tests/check.sh --keep lint tests clang sanitize coverage tidy cppcheck headers \
            docs examples sizes self-check stack fuzz

      # What git has of the project, without the .venv the checks made beside it, whose links
      # arduino-lint would report.
      - name: Copy the library as git has it
        run: build/Demo/tools/arduino_lint.sh --copy-only

      - name: arduino-lint
        uses: arduino/arduino-lint-action@v3
        with:
          path: build/Demo/build/arduino-lint/Demo
          project-type: library
          library-manager: submit
          compliance: strict
